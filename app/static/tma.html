<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q1 eSIM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0a0a0a;color:#fff;overscroll-behavior:none;overflow:hidden;height:100dvh}
  ::-webkit-scrollbar{width:0;height:0}
  .safe-top{padding-top:env(safe-area-inset-top,12px)}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom,8px)}
  .glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);border-radius:16px}
  .glass-strong{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:20px}
  .tab-bar{display:flex;background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);border-radius:20px 20px 0 0;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .tab-btn{flex:1;padding:8px 0;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,0.35);transition:all .2s;position:relative;cursor:pointer;border:none;background:transparent;border-radius:12px}
  .tab-btn.active{color:#fff;background:rgba(255,255,255,0.08)}
  .tab-icon{display:block;margin:0 auto 2px;width:22px;height:22px}
  .tab-icon svg{width:22px;height:22px;fill:currentColor}
  .page{display:none;flex-direction:column;height:100dvh;background:#0a0a0a}
  .page.active{display:flex}
  .page-header{display:flex;align-items:center;padding:12px 16px;gap:12px;min-height:48px;border-bottom:1px solid rgba(255,255,255,0.05)}
  .page-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;transition:background .2s;flex-shrink:0;border:none;background:transparent;color:#fff}
  .page-back:active{background:rgba(255,255,255,0.08)}
  .page-back svg{width:20px;height:20px;fill:currentColor}
  .page-title{font-size:16px;font-weight:600;flex:1}
  .scroll-area{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
  .country-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:all .15s}
  .country-card:active{transform:scale(0.96);background:rgba(255,255,255,0.08)}
  .country-flag{font-size:28px;display:block;margin-bottom:2px}
  .country-name{font-size:12px;color:rgba(255,255,255,0.7)}
  .plan-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
  .plan-card:active{transform:scale(0.98);background:rgba(255,255,255,0.08)}
  .plan-data{font-size:15px;font-weight:600}
  .plan-detail{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px}
  .plan-price{font-size:16px;font-weight:700;color:#e0e0e0}
  .search-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px 12px 38px;color:#fff;font-size:15px;outline:none;transition:border .2s}
  .search-input:focus{border-color:rgba(255,255,255,0.3)}
  .search-input::placeholder{color:rgba(255,255,255,0.25)}
  .search-wrap{position:relative}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:rgba(255,255,255,0.3);pointer-events:none}
  .filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;transition:all .15s;white-space:nowrap}
  .filter-btn.active{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2)}
  .filter-btn:active{transform:scale(0.95)}
  .menu-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:all .15s}
  .menu-item:active{opacity:.6}
  .menu-item:last-child{border-bottom:none}
  .menu-icon{width:24px;height:24px;fill:rgba(255,255,255,0.6);flex-shrink:0}
  .menu-arrow{color:rgba(255,255,255,0.2);font-size:18px}
  .esim-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s}
  .esim-card:active{transform:scale(0.98);background:rgba(255,255,255,0.08)}
  .esim-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .esim-active{background:#aaa;box-shadow:0 0 6px rgba(255,255,255,.2)}
  .esim-inactive{background:#555}
  .esim-expired{background:#333}
  .loader{width:20px;height:20px;border:2px solid rgba(255,255,255,0.08);border-top-color:rgba(255,255,255,0.5);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal-sheet{width:100%;max-width:500px;background:#111;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;margin:0 auto 16px}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);backdrop-filter:blur(16px);padding:10px 20px;border-radius:12px;font-size:13px;color:#fff;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(255,255,255,0.08)}
  .toast.show{opacity:1}
  .flex-center{display:flex;align-items:center;justify-content:center}
  .qr-img{display:block;max-width:240px;margin:16px auto;border-radius:12px}
  .divider{height:1px;background:rgba(255,255,255,0.05);margin:12px 0}
  .stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
  .stat-row:last-child{border-bottom:none}
  .stat-label{color:rgba(255,255,255,0.5);font-size:13px}
  .stat-value{font-size:14px;font-weight:500}
</style>
</head>
<body>

<!-- ===== MAIN PAGE ===== -->
<div class="page active" id="pageMain" style="display:flex">
  <div class="page-header" style="border-bottom-color:rgba(255,255,255,0.06)">
    <div style="font-size:18px;font-weight:700;letter-spacing:-0.3px">q1 eSIM</div>
    <div style="flex:1"></div>
    <div style="font-size:11px;color:rgba(255,255,255,0.3);font-weight:500">v1.0</div>
  </div>
  <div class="scroll-area" style="flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch" id="tabContent">
    <div id="esimTab">
      <div class="search-wrap" style="margin-bottom:12px">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input class="search-input" id="searchInput" placeholder="Поиск страны..." oninput="filterCountries(this.value)">
      </div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch" id="filterRow">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Все</button>
        <button class="filter-btn" data-filter="europe" onclick="setFilter('europe',this)">Европа</button>
        <button class="filter-btn" data-filter="asia" onclick="setFilter('asia',this)">Азия</button>
        <button class="filter-btn" data-filter="americas" onclick="setFilter('americas',this)">Америка</button>
        <button class="filter-btn" data-filter="africa" onclick="setFilter('africa',this)">Африка</button>
        <button class="filter-btn" data-filter="oceania" onclick="setFilter('oceania',this)">Океания</button>
      </div>
      <div id="countryList"></div>
    </div>

    <div id="profileTab" style="display:none">
      <div class="glass-strong" style="padding:24px;text-align:center;margin-bottom:16px">
        <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.1);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:600" id="avatar">?</div>
        <div style="font-size:18px;font-weight:600" id="userName">Гость</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:4px"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#888;display:inline-block"></span> Онлайн</span></div>
      </div>
      <div class="glass" style="padding:4px 16px;margin-bottom:16px">
        <div class="menu-item" onclick="showPage('esims')">
          <svg class="menu-icon" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Мои eSIM</div><div style="font-size:12px;color:rgba(255,255,255,0.35)" id="esimCount">Загрузка...</div></div>
          <span class="menu-arrow">›</span>
        </div>
        <div class="menu-item" onclick="showPage('referral')">
          <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2a7.2 7.2 0 01-6-3.22c.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08a7.2 7.2 0 01-6 3.22z"/></svg>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Реферальная программа</div><div style="font-size:12px;color:rgba(255,255,255,0.35)"><span id="referralBalance">$0.00</span></div></div>
          <span class="menu-arrow">›</span>
        </div>
        <div class="menu-item" onclick="support()">
          <svg class="menu-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Поддержка</div><div style="font-size:12px;color:rgba(255,255,255,0.35)">@q1esim_support</div></div>
          <span class="menu-arrow">›</span>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" id="tabEsim" onclick="switchTab('esim')">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></span>
      eSIM
    </button>
    <button class="tab-btn" id="tabProfile" onclick="switchTab('profile')">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
      Профиль
    </button>
  </div>
</div>

<!-- ===== eSIMS PAGE ===== -->
<div class="page" id="pageEsims">
  <div class="page-header">
    <button class="page-back" onclick="showPage('main')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <span class="page-title">Мои eSIM</span>
  </div>
  <div class="scroll-area" id="esimList"></div>
</div>

<!-- ===== eSIM DETAIL PAGE ===== -->
<div class="page" id="pageEsimDetail">
  <div class="page-header">
    <button class="page-back" onclick="showPage('esims')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <span class="page-title">Детали eSIM</span>
  </div>
  <div class="scroll-area" id="esimDetailContent"></div>
</div>

<!-- ===== REFERRAL PAGE ===== -->
<div class="page" id="pageReferral">
  <div class="page-header">
    <button class="page-back" onclick="showPage('main')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <span class="page-title">Реферальная программа</span>
  </div>
  <div class="scroll-area" id="referralContent"></div>
</div>

<!-- ===== BUY MODAL ===== -->
<div class="modal-overlay" id="planModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <span style="font-size:40px" id="modalFlag">🌐</span>
      <div><div style="font-size:17px;font-weight:600" id="modalCountry">Страна</div><div style="font-size:13px;color:rgba(255,255,255,0.35)">Выберите тариф</div></div>
    </div>
    <div id="modalPlans"><div style="text-align:center;padding:24px"><span class="loader"></span></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const inTelegram = typeof window.Telegram !== 'undefined' && window.Telegram.WebApp;
const tg = inTelegram ? window.Telegram.WebApp : null;
if(tg) { tg.expand(); tg.enableClosingConfirmation(); }

const API_BASE = window.location.origin;
let countries = [];
let allPlans = {};
let userEsims = [];
let userInfo = null;
let currentFilter = 'all';

const COUNTRY_CONTINENT = {
  europe: ['GB','DE','FR','IT','ES','PT','NL','BE','CH','AT','SE','NO','DK','FI','PL','CZ','SK','HU','RO','BG','GR','HR','RS','SI','IE','LT','LV','EE','LU','MT','CY','IS','BA','AL','MK','ME','UA','BY','MD','FO','GI','AD','LI','MC','SM','VA','RU'],
  asia: ['JP','KR','CN','IN','TH','SG','MY','ID','PH','VN','AE','SA','IL','TR','KZ','UZ','KG','TJ','TM','AZ','AM','GE','IR','IQ','JO','LB','KW','BH','QA','OM','YE','AF','PK','BD','LK','NP','BT','MM','LA','KH','BN','MN','MV','TL','PS','SY'],
  americas: ['US','CA','MX','BR','AR','CL','CO','PE','EC','VE','UY','PY','BO','CR','PA','GT','SV','HN','NI','DO','CU','JM','TT','BS','BB','BZ','GY','SR'],
  africa: ['ZA','EG','NG','KE','MA','TN','DZ','LY','GH','CI','SN','CM','UG','TZ','ET','AO','MZ','ZM','ZW','NA','BW','MU','MG','RE','MR','ML','BF','NE','TD','SO','SD','RW','BJ','CG','CD'],
  oceania: ['AU','NZ','FJ','PG','SB','VU','WS','TO','CK','PF','NC','GU'],
};

function getContinent(code) {
  for(const [cont, codes] of Object.entries(COUNTRY_CONTINENT)) {
    if(codes.includes(code)) return cont;
  }
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function apiCall(path, method='POST', body=null) {
  const opts = {method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(API_BASE + path, opts);
  if(!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

async function init() {
  try {
    const initData = tg ? tg.initData : '';
    const res = await apiCall('/tma/init', 'POST', {initData});
    userInfo = res.user;
    userEsims = res.esims || [];
    countries = res.countries || [];

    if(userInfo) {
      document.getElementById('avatar').textContent = (userInfo.first_name||'Г')[0].toUpperCase();
      document.getElementById('userName').textContent = userInfo.first_name || 'Гость';
    }
    document.getElementById('esimCount').textContent = userEsims.length + ' eSIM';
    document.getElementById('referralBalance').textContent = '$' + (userInfo?.referral_earned||'0.00');

    renderCountries();
  } catch(e) {
    showToast('Ошибка загрузки');
    console.error(e);
  }
}

function renderCountries() {
  const list = document.getElementById('countryList');
  list.innerHTML = '';
  countries.forEach(c => {
    const cont = getContinent(c.code);
    list.innerHTML += `<div class="country-card" style="display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;margin-bottom:6px" data-continent="${cont||'other'}" onclick="openPlans('${c.code}')"><span style="font-size:28px">${c.flag||'🌐'}</span><div style="flex:1"><div style="font-size:14px;font-weight:500">${c.name}</div></div><span style="color:rgba(255,255,255,0.25);font-size:18px">›</span></div>`;
  });
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  const cards = document.querySelectorAll('#countryList .country-card');
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  for(let card of cards) {
    const cont = card.dataset.continent;
    const text = card.textContent.toLowerCase();
    const matchFilter = currentFilter === 'all' || cont === currentFilter;
    const matchSearch = !search || text.includes(search);
    card.style.display = (matchFilter && matchSearch) ? 'flex' : 'none';
  }
}

function filterCountries(q) { applyFilter(); }

async function openPlans(code) {
  const modal = document.getElementById('planModal');
  document.getElementById('modalFlag').textContent = '⏳';
  document.getElementById('modalCountry').textContent = 'Загрузка...';
  document.getElementById('modalPlans').innerHTML = '<div style="text-align:center;padding:24px"><span class="loader"></span></div>';
  modal.classList.add('open');

  const c = countries.find(x => x.code === code);
  if(c) { document.getElementById('modalFlag').textContent = c.flag||'🌐'; document.getElementById('modalCountry').textContent = c.name; }

  try {
    let plans = allPlans[code] || [];
    if(!plans.length) {
      const res = await apiCall('/tma/plans', 'POST', {countryCode:code});
      plans = res.plans || [];
      allPlans[code] = plans;
    }
    const container = document.getElementById('modalPlans');
    container.innerHTML = '';
    if(!plans.length) { container.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.35)">Нет доступных тарифов</div>'; return; }
    plans.forEach(p => {
      container.innerHTML += `<div class="plan-card" onclick="buyPlan('${code}','${p.id}')">
        <div><div class="plan-data">${p.data_gb} ГБ</div>
        <div class="plan-detail">${p.days} дней</div></div>
        <div class="plan-price">$${p.price}</div>
      </div>`;
    });
  } catch(e) {
    document.getElementById('modalPlans').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.35)">Ошибка загрузки тарифов</div>';
  }
}

async function buyPlan(countryCode, planId) {
  if(!userInfo) { showToast('Войдите через Telegram'); return; }
  const confirmMsg = 'Подтвердить покупку?';
  if(inTelegram) { tg.showConfirm(confirmMsg, async (ok) => { if(!ok) return; await doBuy(planId); }); }
  else { if(!confirm(confirmMsg)) return; await doBuy(planId); }
}

async function doBuy(planId) {
  try {
    const initData = tg ? tg.initData : '';
    const res = await apiCall('/tma/buy', 'POST', {planId, initData});
    document.getElementById('planModal').classList.remove('open');
    userEsims = res.esims || userEsims;
    showToast('eSIM куплена! ICCID: ' + (res.iccid||'в обработке'));
    document.getElementById('esimCount').textContent = userEsims.length + ' eSIM';
  } catch(e) { showToast(e.message||'Ошибка'); }
}

function switchTab(tab) {
  document.getElementById('esimTab').style.display = tab === 'esim' ? 'block' : 'none';
  document.getElementById('profileTab').style.display = tab === 'profile' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab === 'esim' ? 'tabEsim' : 'tabProfile').classList.add('active');
  if(tg) tg.HapticFeedback.impactOccurred('light');
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  if(name === 'esims') renderEsims();
  if(name === 'referral') renderReferral();
}

function renderEsims() {
  const container = document.getElementById('esimList');
  container.innerHTML = '';
  if(!userEsims.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.35)">У вас нет eSIM</div>';
    return;
  }
  userEsims.forEach(e => {
    const statusClass = e.status === 'active' ? 'esim-active' : (e.status === 'expired' ? 'esim-expired' : 'esim-inactive');
    const statusText = e.status === 'active' ? 'Активна' : (e.status === 'expired' ? 'Истекла' : 'Неактивна');
    container.innerHTML += `<div class="esim-card" onclick="showEsimDetail('${e.iccid}')">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="esim-dot ${statusClass}"></span>
        <div>
          <div style="font-size:14px;font-weight:500;font-family:monospace">${e.iccid}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px">${e.country||'—'} · ${e.plan||'—'} · ${statusText}</div>
        </div>
      </div>
      <span style="color:rgba(255,255,255,0.25);font-size:18px">›</span>
    </div>`;
  });
}

function showEsimDetail(iccid) {
  const e = userEsims.find(x => x.iccid === iccid);
  if(!e) return;
  const container = document.getElementById('esimDetailContent');
  const statusClass = e.status === 'active' ? 'esim-active' : (e.status === 'expired' ? 'esim-expired' : 'esim-inactive');
  const statusText = e.status === 'active' ? 'Активна' : (e.status === 'expired' ? 'Истекла' : 'Неактивна');

  let qrHtml = '';
  if(e.qr_code_data) {
    qrHtml = `<img class="qr-img" src="data:image/png;base64,${e.qr_code_data}" alt="QR">`;
  } else if(e.qr_code_url) {
    qrHtml = `<img class="qr-img" src="${e.qr_code_url}" alt="QR">`;
  }

  container.innerHTML = `
    <div class="glass-strong" style="padding:20px;text-align:center;margin-bottom:16px">
      <div style="font-size:32px;margin-bottom:4px">📱</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.4)">ICCID</div>
      <div style="font-size:14px;font-family:monospace;margin-top:2px">${e.iccid}</div>
    </div>
    <div class="glass" style="padding:16px;margin-bottom:16px">
      <div class="stat-row"><span class="stat-label">Статус</span><span class="stat-value"><span class="esim-dot ${statusClass}" style="vertical-align:middle"></span>${statusText}</span></div>
      <div class="stat-row"><span class="stat-label">Страна</span><span class="stat-value">${e.country||'—'}</span></div>
      <div class="stat-row"><span class="stat-label">Тариф</span><span class="stat-value">${e.plan||'—'}</span></div>
    </div>
    ${qrHtml ? `<div class="glass" style="padding:16px;margin-bottom:16px"><div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:8px">QR-код для активации</div>${qrHtml}</div>` : ''}
    <button onclick="showPage('esims')" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#fff;font-size:14px;cursor:pointer;margin-bottom:16px">← Назад к списку</button>
  `;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('pageEsimDetail').classList.add('active');
}

function renderReferral() {
  const container = document.getElementById('referralContent');
  if(!userInfo) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.35)">Войдите через Telegram</div>';
    return;
  }
  const link = userInfo.referral_link || 'https://t.me/q1esim_bot';
  container.innerHTML = `
    <div class="glass-strong" style="padding:20px;text-align:center;margin-bottom:16px">
      <div style="font-size:32px;margin-bottom:4px">🎁</div>
      <div style="font-size:17px;font-weight:600">Реферальная программа</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:4px">Приглашайте друзей и получайте 30% с каждой покупки</div>
    </div>
    <div class="glass" style="padding:16px;margin-bottom:16px">
      <div class="stat-row"><span class="stat-label">Ваш доход</span><span class="stat-value">$${userInfo.referral_earned||'0.00'}</span></div>
      <div class="stat-row"><span class="stat-label">Комиссия</span><span class="stat-value">30%</span></div>
    </div>
    <div class="glass" style="padding:16px;margin-bottom:16px">
      <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:8px">Ваша реферальная ссылка</div>
      <div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:10px;font-size:12px;font-family:monospace;word-break:break-all;margin-bottom:10px;color:rgba(255,255,255,0.7)">${link}</div>
      <button onclick="copyReferralLink('${link}')" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;cursor:pointer">📋 Скопировать ссылку</button>
    </div>
    <div style="font-size:12px;color:rgba(255,255,255,0.25);text-align:center;margin-bottom:16px">Деньги начисляются автоматически после покупки друга</div>
  `;
}

function copyReferralLink(link) {
  if(navigator.clipboard) {
    navigator.clipboard.writeText(link).then(() => showToast('Скопировано!'));
  } else { showToast(link); }
  if(tg) tg.HapticFeedback.notificationOccurred('success');
}

function support() {
  if(inTelegram) tg.openTelegramLink('https://t.me/q1esim_support');
  else window.open('https://t.me/q1esim_support', '_blank');
}

document.getElementById('planModal').addEventListener('click', function(e) {
  if(e.target === this) this.classList.remove('open');
});

init();
</script>
</body>
</html>
