<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q1 eSIM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#050510;color:#fff;overscroll-behavior:none;overflow-x:hidden}
  ::-webkit-scrollbar{width:0;height:0}
  .safe-top{padding-top:env(safe-area-inset-top,12px)}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom,8px)}
  .glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06);border-radius:16px}
  .glass-strong{background:rgba(255,255,255,0.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:20px}
  .tab-btn{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);transition:all .2s;position:relative;cursor:pointer;border:none;background:transparent}
  .tab-btn.active{color:#fff}
  .tab-btn.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:linear-gradient(90deg,#7c3aed,#3b82f6);border-radius:2px}
  .tab-icon{display:block;font-size:22px;margin-bottom:2px}
  .country-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:all .2s}
  .country-card:active{transform:scale(0.96);background:rgba(255,255,255,0.08)}
  .country-flag{font-size:32px;display:block;margin-bottom:4px}
  .country-name{font-size:12px;color:rgba(255,255,255,0.7)}
  .plan-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}
  .plan-card:active{transform:scale(0.98);background:rgba(255,255,255,0.08)}
  .plan-data{font-size:15px;font-weight:600}
  .plan-detail{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px}
  .plan-price{font-size:16px;font-weight:700;background:linear-gradient(90deg,#7c3aed,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .search-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;color:#fff;font-size:15px;outline:none;transition:border .2s}
  .search-input:focus{border-color:#7c3aed}
  .search-input::placeholder{color:rgba(255,255,255,0.3)}
  .menu-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:all .2s}
  .menu-item:active{opacity:.6}
  .menu-item:last-child{border-bottom:none}
  .badge{background:linear-gradient(90deg,#7c3aed,#3b82f6);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;color:#fff}
  .esim-item{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .esim-status{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
  .esim-active{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.4)}
  .esim-inactive{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.4)}
  .esim-expired{background:#6b7280}
  .loader{width:20px;height:20px;border:2px solid rgba(255,255,255,0.1);border-top-color:#7c3aed;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal-sheet{width:100%;max-width:500px;background:#0d0d1a;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 16px}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.1);backdrop-filter:blur(16px);padding:10px 20px;border-radius:12px;font-size:13px;color:#fff;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  .backdrop-glow{position:fixed;top:-40%;left:-20%;width:80%;height:80%;background:radial-gradient(circle,rgba(124,58,237,.15) 0%,transparent 70%);pointer-events:none;z-index:0}
  .content{z-index:1;position:relative}
</style>
</head>
<body>
<div class="backdrop-glow"></div>

<div class="content safe-top" style="min-height:100vh;display:flex;flex-direction:column">
  <div style="padding:16px 16px 0;flex:1;overflow-y:auto" id="tabContent">
    <div id="esimTab">
      <div style="margin-bottom:16px">
        <input class="search-input" id="searchInput" placeholder="🔍  Search country..." oninput="filterCountries(this.value)">
      </div>
      <div style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.4);font-weight:500">POPULAR</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px" id="countryGrid"></div>
      <div style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.4);font-weight:500">ALL COUNTRIES</div>
      <div id="countryList"></div>
    </div>
    <div id="profileTab" style="display:none">
      <div class="glass-strong" style="padding:24px;text-align:center;margin-bottom:16px">
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#3b82f6);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:600" id="avatar">?</div>
        <div style="font-size:18px;font-weight:600" id="userName">User</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px">
          <span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block"></span>
          Online
        </div>
      </div>
      <div class="glass" style="padding:4px 16px;margin-bottom:16px">
        <div class="menu-item" onclick="goToMyEsims()">
          <span style="font-size:22px">📱</span>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">My eSIMs</div><div style="font-size:12px;color:rgba(255,255,255,0.4)" id="esimCount">Loading...</div></div>
          <span style="color:rgba(255,255,255,0.3)">›</span>
        </div>
        <div class="menu-item" onclick="copyReferral()">
          <span style="font-size:22px">🎁</span>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Referral Program</div><div style="font-size:12px;color:rgba(255,255,255,0.4)">Earn <span id="referralPercent">5</span>% from every purchase</div></div>
          <span style="font-size:12px;color:rgba(255,255,255,0.4)" id="referralBalance">$0.00</span>
        </div>
        <div class="menu-item" onclick="support()">
          <span style="font-size:22px">💬</span>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Support</div><div style="font-size:12px;color:rgba(255,255,255,0.4)">@q1esim_support</div></div>
          <span style="color:rgba(255,255,255,0.3)">›</span>
        </div>
      </div>
    </div>
  </div>

  <div class="glass-strong" style="margin:0 16px 8px;display:flex;padding:4px;border-radius:14px">
    <button class="tab-btn active" id="tabEsim" onclick="switchTab('esim')"><span class="tab-icon">🌍</span>eSIM</button>
    <button class="tab-btn" id="tabProfile" onclick="switchTab('profile')"><span class="tab-icon">👤</span>Profile</button>
  </div>
</div>

<div class="modal-overlay" id="planModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <span style="font-size:40px" id="modalFlag">🌐</span>
      <div><div style="font-size:17px;font-weight:600" id="modalCountry">Country</div><div style="font-size:13px;color:rgba(255,255,255,0.4)">Select a data plan</div></div>
    </div>
    <div id="modalPlans"><div style="text-align:center;padding:24px"><span class="loader"></span></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.enableClosingConfirmation();
const theme = tg.colorScheme || 'dark';
document.body.style.background = theme === 'dark' ? '#050510' : '#f5f5f5';

const API_BASE = window.location.origin;
let userData = null;
let countries = [];
let allPlans = {};
let userEsims = [];
let userInfo = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function apiCall(path, method='POST', body=null) {
  const opts = {method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(API_BASE + path, opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function init() {
  try {
    const initData = tg.initData;
    if(!initData) { showToast('Please open from Telegram'); return; }
    const res = await apiCall('/tma/init', 'POST', {initData});
    userInfo = res.user;
    userEsims = res.esims || [];
    countries = res.countries || [];
    allPlans = res.plans || {};

    document.getElementById('avatar').textContent = (userInfo.first_name||'U')[0].toUpperCase();
    document.getElementById('userName').textContent = userInfo.first_name + (userInfo.last_name?' '+userInfo.last_name:'');
    document.getElementById('esimCount').textContent = userEsims.length + ' eSIM(s)';
    document.getElementById('referralBalance').textContent = '$' + (userInfo.referral_earned||'0.00');

    renderCountries();
    if(tg.initDataUnsafe.start_param === 'profile') switchTab('profile');
  } catch(e) {
    showToast('Error loading data');
    console.error(e);
  }
}

function renderCountries() {
  const grid = document.getElementById('countryGrid');
  const list = document.getElementById('countryList');
  grid.innerHTML = '';
  list.innerHTML = '';

  const popular = countries.slice(0,8);
  popular.forEach(c => {
    grid.innerHTML += `<div class="country-card" onclick="openPlans('${c.code}')"><span class="country-flag">${c.flag||'🌐'}</span><span class="country-name">${c.name}</span></div>`;
  });

  countries.forEach(c => {
    list.innerHTML += `<div class="country-card" style="display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;margin-bottom:6px" onclick="openPlans('${c.code}')"><span style="font-size:28px">${c.flag||'🌐'}</span><div style="flex:1"><div style="font-size:14px;font-weight:500">${c.name}</div></div><span style="color:rgba(255,255,255,0.3);font-size:18px">›</span></div>`;
  });
}

function filterCountries(q) {
  const cards = document.getElementById('countryList').children;
  const grid = document.getElementById('countryGrid');
  grid.style.display = q ? 'none' : 'grid';
  for(let c of cards) c.style.display = c.textContent.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none';
}

async function openPlans(code) {
  const modal = document.getElementById('planModal');
  document.getElementById('modalFlag').textContent = '⏳';
  document.getElementById('modalCountry').textContent = 'Loading...';
  document.getElementById('modalPlans').innerHTML = '<div style="text-align:center;padding:24px"><span class="loader"></span></div>';
  modal.classList.add('open');

  const c = countries.find(x => x.code === code);
  if(c) { document.getElementById('modalFlag').textContent = c.flag||'🌐'; document.getElementById('modalCountry').textContent = c.name; }

  try {
    let plans = allPlans[code] || [];
    if(!plans.length) {
      const res = await apiCall('/tma/plans', 'POST', {countryCode:code});
      plans = res.plans || [];
      allPlans[code] = plans;
    }
    const container = document.getElementById('modalPlans');
    container.innerHTML = '';
    if(!plans.length) { container.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4)">No plans available</div>'; return; }
    plans.forEach(p => {
      container.innerHTML += `<div class="plan-card" onclick="buyPlan('${code}','${p.id}')">
        <div><div class="plan-data">${p.data_gb} GB</div>
        <div class="plan-detail">${p.days} days</div></div>
        <div class="plan-price">$${p.price}</div>
      </div>`;
    });
  } catch(e) { document.getElementById('modalPlans').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4)">Failed to load plans</div>'; }
}

async function buyPlan(countryCode, planId) {
  tg.showConfirm('Confirm purchase?', async (ok) => {
    if(!ok) return;
    try {
      const res = await apiCall('/tma/buy', 'POST', {planId});
      document.getElementById('planModal').classList.remove('open');
      showToast('✅ eSIM purchased! ICCID: ' + (res.iccid||'processing'));
    } catch(e) { showToast('❌ ' + e.message); }
  });
}

function switchTab(tab) {
  document.getElementById('esimTab').style.display = tab === 'esim' ? 'block' : 'none';
  document.getElementById('profileTab').style.display = tab === 'profile' ? 'block' : 'none';
  document.getElementById('tabEsim').classList.toggle('active', tab === 'esim');
  document.getElementById('tabProfile').classList.toggle('active', tab === 'profile');
  tg.HapticFeedback.impactOccurred('light');
}

function goToMyEsims() {
  if(!userEsims.length) { showToast('No eSIMs yet'); return; }
  const lines = userEsims.map(e => `${e.status==='active'?'🟢':'🔴'} ${e.iccid}\n${e.country||''} · ${e.plan||''}`).join('\n\n');
  tg.showAlert(lines);
}

function copyReferral() {
  const link = userInfo?.referral_link || 'https://t.me/'+tg.initDataUnsafe.bot.username+'?start='+userInfo?.referral_code;
  tg.HapticFeedback.notificationOccurred('success');
  if(navigator.clipboard) { navigator.clipboard.writeText(link).then(() => showToast('✅ Copied!')); }
  else { tg.showAlert(link); }
}

function support() {
  tg.openTelegramLink('https://t.me/q1esim_support');
}

document.getElementById('planModal').addEventListener('click', function(e) {
  if(e.target === this) this.classList.remove('open');
});

init();
</script>
</body>
</html>
