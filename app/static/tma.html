<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q1 eSIM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0a0a0a;color:#fff;overscroll-behavior:none;overflow:hidden;height:100dvh}
  ::-webkit-scrollbar{width:0;height:0}
  .safe-top{padding-top:env(safe-area-inset-top,12px)}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom,8px)}
  .glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);border-radius:16px}
  .glass-strong{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:20px}
  .tab-bar{display:flex;background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);border-radius:20px 20px 0 0;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .tab-btn{flex:1;padding:8px 0;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,0.35);transition:all .2s;position:relative;cursor:pointer;border:none;background:transparent;border-radius:12px}
  .tab-btn.active{color:#fff;background:rgba(255,255,255,0.08)}
  .tab-icon{display:block;font-size:20px;margin-bottom:1px}
  .country-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:all .15s}
  .country-card:active{transform:scale(0.96);background:rgba(255,255,255,0.08)}
  .country-flag{font-size:28px;display:block;margin-bottom:4px}
  .country-name{font-size:12px;color:rgba(255,255,255,0.7)}
  .plan-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
  .plan-card:active{transform:scale(0.98);background:rgba(255,255,255,0.08)}
  .plan-data{font-size:15px;font-weight:600}
  .plan-detail{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px}
  .plan-price{font-size:16px;font-weight:700;color:#e0e0e0}
  .search-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;color:#fff;font-size:15px;outline:none;transition:border .2s}
  .search-input:focus{border-color:rgba(255,255,255,0.3)}
  .search-input::placeholder{color:rgba(255,255,255,0.25)}
  .filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;transition:all .15s;white-space:nowrap}
  .filter-btn.active{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2)}
  .filter-btn:active{transform:scale(0.95)}
  .menu-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:all .15s}
  .menu-item:active{opacity:.6}
  .menu-item:last-child{border-bottom:none}
  .esim-item{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .esim-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
  .esim-active{background:#aaa;box-shadow:0 0 6px rgba(255,255,255,.2)}
  .esim-inactive{background:#555}
  .esim-expired{background:#333}
  .loader{width:20px;height:20px;border:2px solid rgba(255,255,255,0.08);border-top-color:rgba(255,255,255,0.5);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal-sheet{width:100%;max-width:500px;background:#111;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;margin:0 auto 16px}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);padding:10px 20px;border-radius:12px;font-size:13px;color:#fff;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  .scroll-area{flex:1;overflow-y:auto;padding:16px 16px 0;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>

<div style="height:100dvh;display:flex;flex-direction:column">
  <div class="scroll-area" id="tabContent">
    <div id="esimTab">
      <input class="search-input" id="searchInput" placeholder="🔍 Поиск страны..." oninput="filterCountries(this.value)" style="margin-bottom:12px">
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch" id="filterRow">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Все</button>
        <button class="filter-btn" data-filter="europe" onclick="setFilter('europe',this)">Европа</button>
        <button class="filter-btn" data-filter="asia" onclick="setFilter('asia',this)">Азия</button>
        <button class="filter-btn" data-filter="americas" onclick="setFilter('americas',this)">Америка</button>
        <button class="filter-btn" data-filter="africa" onclick="setFilter('africa',this)">Африка</button>
        <button class="filter-btn" data-filter="oceania" onclick="setFilter('oceania',this)">Океания</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px" id="countryGrid"></div>
      <div id="countryList" style="margin-bottom:16px"></div>
    </div>

    <div id="profileTab" style="display:none">
      <div class="glass-strong" style="padding:24px;text-align:center;margin-bottom:16px">
        <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.1);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:600" id="avatar">?</div>
        <div style="font-size:18px;font-weight:600" id="userName">Гость</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:4px">
          <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#888;display:inline-block"></span> Онлайн</span>
        </div>
      </div>
      <div class="glass" style="padding:4px 16px;margin-bottom:16px">
        <div class="menu-item" onclick="goToMyEsims()">
          <span style="font-size:22px">📱</span>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Мои eSIM</div><div style="font-size:12px;color:rgba(255,255,255,0.35)" id="esimCount">Загрузка...</div></div>
          <span style="color:rgba(255,255,255,0.25);font-size:18px">›</span>
        </div>
        <div class="menu-item" onclick="copyReferral()">
          <span style="font-size:22px">🎁</span>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Реферальная программа</div><div style="font-size:12px;color:rgba(255,255,255,0.35)">Заработано <span id="referralBalance">$0.00</span></div></div>
          <span style="color:rgba(255,255,255,0.25)">›</span>
        </div>
        <div class="menu-item" onclick="support()">
          <span style="font-size:22px">💬</span>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">Поддержка</div><div style="font-size:12px;color:rgba(255,255,255,0.35)">@q1esim_support</div></div>
          <span style="color:rgba(255,255,255,0.25)">›</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" id="tabEsim" onclick="switchTab('esim')"><span class="tab-icon">🌍</span>eSIM</button>
    <button class="tab-btn" id="tabProfile" onclick="switchTab('profile')"><span class="tab-icon">👤</span>Профиль</button>
  </div>
</div>

<div class="modal-overlay" id="planModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <span style="font-size:40px" id="modalFlag">🌐</span>
      <div><div style="font-size:17px;font-weight:600" id="modalCountry">Страна</div><div style="font-size:13px;color:rgba(255,255,255,0.35)">Выберите тариф</div></div>
    </div>
    <div id="modalPlans"><div style="text-align:center;padding:24px"><span class="loader"></span></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const inTelegram = typeof window.Telegram !== 'undefined' && window.Telegram.WebApp;
const tg = inTelegram ? window.Telegram.WebApp : null;
if(tg) { tg.expand(); tg.enableClosingConfirmation(); }

const API_BASE = window.location.origin;
let countries = [];
let allPlans = {};
let userEsims = [];
let userInfo = null;
let currentFilter = 'all';

const COUNTRY_CONTINENT = {
  europe: ['GB','DE','FR','IT','ES','PT','NL','BE','CH','AT','SE','NO','DK','FI','PL','CZ','SK','HU','RO','BG','GR','HR','RS','SI','IE','LT','LV','EE','LU','MT','CY','IS','BA','AL','MK','ME','UA','BY','MD','FO','GI','AD','LI','MC','SM','VA'],
  asia: ['JP','KR','CN','IN','TH','SG','MY','ID','PH','VN','AE','SA','IL','TR','RU','KZ','UZ','KG','TJ','TM','AZ','AM','GE','IR','IQ','JO','LB','KW','BH','QA','OM','YE','AF','PK','BD','LK','NP','BT','MM','LA','KH','BN','MN','MV','TL','PS','SY'],
  americas: ['US','CA','MX','BR','AR','CL','CO','PE','EC','VE','UY','PY','BO','CR','PA','GT','SV','HN','NI','DO','CU','JM','TT','BS','BB','BZ','GY','SR'],
  africa: ['ZA','EG','NG','KE','MA','TN','DZ','LY','GH','CI','SN','CM','UG','TZ','ET','AO','MZ','ZM','ZW','NA','BW','MU','MG','RE','MR','ML','BF','NE','TD','SO','SD','RW','BJ','CG','CD'],
  oceania: ['AU','NZ','FJ','PG','SB','VU','WS','TO','CK','PF','NC','GU'],
};

function getContinent(code) {
  for(const [cont, codes] of Object.entries(COUNTRY_CONTINENT)) {
    if(codes.includes(code)) return cont;
  }
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function apiCall(path, method='POST', body=null) {
  const opts = {method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(API_BASE + path, opts);
  if(!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

async function init() {
  try {
    const initData = tg ? tg.initData : '';
    const res = await apiCall('/tma/init', 'POST', {initData});
    userInfo = res.user;
    userEsims = res.esims || [];
    countries = res.countries || [];

    if(userInfo) {
      document.getElementById('avatar').textContent = (userInfo.first_name||'Г')[0].toUpperCase();
      document.getElementById('userName').textContent = userInfo.first_name || 'Гость';
    }
    document.getElementById('esimCount').textContent = userEsims.length + ' eSIM';
    document.getElementById('referralBalance').textContent = '$' + (userInfo?.referral_earned||'0.00');

    renderCountries();
  } catch(e) {
    showToast('Ошибка загрузки');
    console.error(e);
  }
}

function renderCountries() {
  const grid = document.getElementById('countryGrid');
  const list = document.getElementById('countryList');
  grid.innerHTML = '';
  list.innerHTML = '';

  countries.forEach(c => {
    const cont = getContinent(c.code);
    const html = `<div class="country-card" style="display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;margin-bottom:6px" data-continent="${cont||'other'}" onclick="openPlans('${c.code}')"><span style="font-size:28px">${c.flag||'🌐'}</span><div style="flex:1"><div style="font-size:14px;font-weight:500">${c.name}</div></div><span style="color:rgba(255,255,255,0.25);font-size:18px">›</span></div>`;
    list.innerHTML += html;
  });

  applyFilter();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  const cards = document.querySelectorAll('#countryList .country-card');
  const grid = document.getElementById('countryGrid');
  const search = (document.getElementById('searchInput').value || '').toLowerCase();

  grid.innerHTML = '';
  if(currentFilter === 'all' && !search) {
    const shown = countries.filter(c => {
      const cont = getContinent(c.code);
      return !search || c.name.toLowerCase().includes(search) || c.code.toLowerCase().includes(search);
    });
    shown.slice(0,8).forEach(c => {
      grid.innerHTML += `<div class="country-card" onclick="openPlans('${c.code}')"><span class="country-flag">${c.flag||'🌐'}</span><span class="country-name">${c.name}</span></div>`;
    });
  }

  for(let card of cards) {
    const cont = card.dataset.continent;
    const text = card.textContent.toLowerCase();
    const matchFilter = currentFilter === 'all' || cont === currentFilter;
    const matchSearch = !search || text.includes(search);
    card.style.display = (matchFilter && matchSearch) ? 'flex' : 'none';
  }
}

function filterCountries(q) {
  applyFilter();
}

async function openPlans(code) {
  const modal = document.getElementById('planModal');
  document.getElementById('modalFlag').textContent = '⏳';
  document.getElementById('modalCountry').textContent = 'Загрузка...';
  document.getElementById('modalPlans').innerHTML = '<div style="text-align:center;padding:24px"><span class="loader"></span></div>';
  modal.classList.add('open');

  const c = countries.find(x => x.code === code);
  if(c) { document.getElementById('modalFlag').textContent = c.flag||'🌐'; document.getElementById('modalCountry').textContent = c.name; }

  try {
    let plans = allPlans[code] || [];
    if(!plans.length) {
      const res = await apiCall('/tma/plans', 'POST', {countryCode:code});
      plans = res.plans || [];
      allPlans[code] = plans;
    }
    const container = document.getElementById('modalPlans');
    container.innerHTML = '';
    if(!plans.length) { container.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.35)">Нет доступных тарифов</div>'; return; }
    plans.forEach(p => {
      container.innerHTML += `<div class="plan-card" onclick="buyPlan('${code}','${p.id}')">
        <div><div class="plan-data">${p.data_gb} ГБ</div>
        <div class="plan-detail">${p.days} дней</div></div>
        <div class="plan-price">$${p.price}</div>
      </div>`;
    });
  } catch(e) {
    document.getElementById('modalPlans').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.35)">Ошибка загрузки тарифов</div>';
  }
}

async function buyPlan(countryCode, planId) {
  if(!userInfo) { showToast('❌ Войдите через Telegram'); return; }
  const confirmMsg = 'Подтвердить покупку?';
  if(inTelegram) {
    tg.showConfirm(confirmMsg, async (ok) => {
      if(!ok) return;
      await doBuy(planId);
    });
  } else {
    if(!confirm(confirmMsg)) return;
    await doBuy(planId);
  }
}

async function doBuy(planId) {
  try {
    const initData = tg ? tg.initData : '';
    const res = await apiCall('/tma/buy', 'POST', {planId, initData});
    document.getElementById('planModal').classList.remove('open');
    showToast('✅ eSIM куплена! ICCID: ' + (res.iccid||'в обработке'));
  } catch(e) { showToast('❌ ' + (e.message||'Ошибка')); }
}

function switchTab(tab) {
  document.getElementById('esimTab').style.display = tab === 'esim' ? 'block' : 'none';
  document.getElementById('profileTab').style.display = tab === 'profile' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab === 'esim' ? 'tabEsim' : 'tabProfile').classList.add('active');
  if(tg) tg.HapticFeedback.impactOccurred('light');
}

function goToMyEsims() {
  if(!userEsims.length) { showToast('Нет eSIM'); return; }
  const lines = userEsims.map(e => `${e.status==='active'?'🟢':'🔴'} ${e.iccid}`).join('\n\n');
  if(inTelegram) tg.showAlert(lines);
  else alert(lines);
}

function copyReferral() {
  if(!userInfo) { showToast('Войдите через Telegram'); return; }
  const link = userInfo.referral_link || 'https://t.me/q1esim_bot?start=' + (userInfo.referral_code||'');
  if(inTelegram) tg.HapticFeedback.notificationOccurred('success');
  if(navigator.clipboard) { navigator.clipboard.writeText(link).then(() => showToast('✅ Скопировано!')); }
  else { showToast(link); }
}

function support() {
  if(inTelegram) tg.openTelegramLink('https://t.me/q1esim_support');
  else window.open('https://t.me/q1esim_support', '_blank');
}

document.getElementById('planModal').addEventListener('click', function(e) {
  if(e.target === this) this.classList.remove('open');
});

init();
</script>
</body>
</html>
